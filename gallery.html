<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life 100 갤러리</title>
<style>
  :root {
    --bg: #0f1117;
    --card-bg: #1a1d27;
    --card-border: #2a2e3a;
    --accent: #6c8cff;
    --accent-2: #ffb020;
    --text: #e8e9ee;
    --text-dim: #9a9ea8;
    --done: #3ddc84;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 28px;
    text-align: center;
  }
  header h1 {
    font-size: 1.8rem;
    margin-bottom: 4px;
  }
  header p {
    color: var(--text-dim);
    margin-top: 0;
  }
  .counter-box {
    max-width: 420px;
    margin: 20px auto 0;
    background: linear-gradient(135deg, #232840, #171a26);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 22px;
  }
  .counter-number {
    font-size: 3rem;
    font-weight: 800;
    color: var(--done);
    line-height: 1;
  }
  .counter-label {
    color: var(--text-dim);
    margin-top: 6px;
    font-size: 0.95rem;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
  }
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 28px 0 20px;
  }
  .filter-btn {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.15s ease;
  }
  .filter-btn:hover {
    border-color: var(--accent);
  }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f1117;
    font-weight: 600;
  }
  section.gallery-section {
    margin-top: 40px;
  }
  section.gallery-section h2 {
    font-size: 1.3rem;
    border-left: 4px solid var(--accent);
    padding-left: 10px;
    margin-bottom: 16px;
  }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 16px;
    overflow: hidden;
    transition: transform 0.15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
  }
  .card .cat-tag {
    display: inline-block;
    font-size: 0.7rem;
    color: var(--accent);
    background: rgba(108,140,255,0.12);
    border-radius: 6px;
    padding: 2px 8px;
    margin-bottom: 8px;
  }
  .card .text {
    font-size: 0.95rem;
    line-height: 1.4;
    margin-bottom: 10px;
  }
  .card .meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .rarity-pill {
    background: rgba(255,176,32,0.12);
    color: var(--accent-2);
    border-radius: 6px;
    padding: 2px 8px;
  }
  .ribbon {
    position: absolute;
    top: 10px;
    right: -32px;
    background: var(--done);
    color: #0f1117;
    font-weight: 700;
    font-size: 0.7rem;
    padding: 4px 36px;
    transform: rotate(35deg);
  }
  .empty-msg {
    color: var(--text-dim);
    text-align: center;
    padding: 30px;
    border: 1px dashed var(--card-border);
    border-radius: 12px;
  }
  .hidden { display: none !important; }
  footer {
    max-width: 1100px;
    margin: 60px auto 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>🌱 Life 100 — 살면서 경험해볼 100가지</h1>
  <p>지금까지 완료한 경험과 해보고 싶은 경험의 아카이브</p>
  <div class="counter-box">
    <div class="counter-number" id="counterNumber">0</div>
    <div class="counter-label">지금까지 완료한 경험</div>
  </div>
</header>

<div class="container">

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-cat="all">전체</button>
    <button class="filter-btn" data-cat="daily">daily 일상</button>
    <button class="filter-btn" data-cat="family">family 가족</button>
    <button class="filter-btn" data-cat="culture">culture 문화</button>
    <button class="filter-btn" data-cat="travel">travel 여행</button>
    <button class="filter-btn" data-cat="sports">sports 스포츠</button>
    <button class="filter-btn" data-cat="society">society 사회</button>
    <button class="filter-btn" data-cat="career">career 커리어</button>
    <button class="filter-btn" data-cat="academia">academia 학업</button>
    <button class="filter-btn" data-cat="science">science 과학</button>
    <button class="filter-btn" data-cat="extreme">extreme 극한도전</button>
  </div>

  <section class="gallery-section">
    <h2>⭐ 해보고 싶은 것들</h2>
    <div class="card-grid" id="wishlistGrid"></div>
  </section>

  <section class="gallery-section">
    <h2>✅ 지금까지 완료한 것들</h2>
    <div class="card-grid" id="completedGrid"></div>
  </section>

</div>

<footer>
  <p>매일 아침 새로운 100가지 경험이 이슈로 올라오고, 체크한 기록이 여기 계속 쌓입니다.</p>
  <p><a href="./README.md">README로 돌아가기</a></p>
</footer>

<script>
async function loadJson(path) {
  try {
    const res = await fetch(path + '?_=' + Date.now());
    if (!res.ok) return [];
    return await res.json();
  } catch (e) {
    console.error('failed to load', path, e);
    return [];
  }
}

function categoryLabel(cat) {
  const map = {
    daily: 'daily 일상', family: 'family 가족', culture: 'culture 문화',
    travel: 'travel 여행', sports: 'sports 스포츠', society: 'society 사회',
    career: 'career 커리어', academia: 'academia 학업', science: 'science 과학',
    extreme: 'extreme 극한도전'
  };
  return map[cat] || cat;
}

function makeKey(item) {
  return (item.text || '') + '|' + (item.category || '');
}

function renderCompletedCard(item) {
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.cat = item.category || '';
  div.innerHTML =
    '<span class="cat-tag">' + categoryLabel(item.category) + '</span>' +
    '<div class="text">' + escapeHtml(item.text || '') + '</div>' +
    '<div class="meta">' +
      '<span class="rarity-pill">희귀도 ' + (item.rarity != null ? item.rarity : '?') + '/10</span>' +
      '<span>' + (item.done_at || '') + '</span>' +
    '</div>';
  return div;
}

function renderWishlistCard(item, doneSet) {
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.cat = item.category || '';
  const isDone = doneSet.has(makeKey(item));
  div.innerHTML =
    (isDone ? '<div class="ribbon">✅ 완료</div>' : '') +
    '<span class="cat-tag">' + categoryLabel(item.category) + '</span>' +
    '<div class="text">' + escapeHtml(item.text || '') + '</div>' +
    '<div class="meta">' +
      '<span class="rarity-pill">희귀도 ' + (item.rarity != null ? item.rarity : '?') + '/10</span>' +
      '<span>' + (item.added_at || '') + '</span>' +
    '</div>';
  return div;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function applyFilter(cat) {
  document.querySelectorAll('.card').forEach(function(card) {
    if (cat === 'all' || card.dataset.cat === cat) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });
}

async function init() {
  const [completed, wishlist] = await Promise.all([
    loadJson('./completed_log.json'),
    loadJson('./wishlist_log.json')
  ]);

  document.getElementById('counterNumber').textContent = completed.length;

  const completedSorted = completed.slice().sort(function(a, b) {
    return (a.done_at || '').localeCompare(b.done_at || '');
  });

  const completedGrid = document.getElementById('completedGrid');
  if (completedSorted.length === 0) {
    completedGrid.innerHTML = '<div class="empty-msg">아직 완료한 경험이 없어요. GitHub 이슈에서 체크박스를 눌러보세요!</div>';
  } else {
    completedSorted.forEach(function(item) {
      completedGrid.appendChild(renderCompletedCard(item));
    });
  }

  const doneSet = new Set(completed.map(makeKey));
  const wishlistGrid = document.getElementById('wishlistGrid');
  if (wishlist.length === 0) {
    wishlistGrid.innerHTML = '<div class="empty-msg">아직 해보고 싶은 경험이 없어요.</div>';
  } else {
    wishlist.forEach(function(item) {
      wishlistGrid.appendChild(renderWishlistCard(item, doneSet));
    });
  }

  document.getElementById('filterBar').addEventListener('click', function(e) {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    applyFilter(btn.dataset.cat);
  });
}

init();
</script>

</body>
</html>
